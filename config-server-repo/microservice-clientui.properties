server.port=8082
spring.application.name=microservice-clientui

# Eureka
# IMPORTANT : dans Docker, on utilise le nom du service
# "eureka-server" au lieu de "localhost"
# Parce que chaque conteneur a son propre "localhost"
# Pour communiquer entre conteneurs → nom du service Docker
eureka.client.service-url.defaultZone=http://eureka-server:9201/eureka/
eureka.client.registerWithEureka=true
eureka.client.fetchRegistry=true
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=microservice-clientui

# Zipkin
#spring.zipkin.base-url=http://localhost:9411
#spring.sleuth.sampler.probability=1.0

spring.main.allow-bean-definition-overriding=true
