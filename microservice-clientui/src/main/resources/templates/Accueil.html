<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Mcommerce — Boutique</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important; }
        .navbar-brand, .nav-link { color: white !important; }
        .card { transition: transform 0.2s; border: none; border-radius: 12px; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15) !important; }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); border: none; }
        .badge-role { font-size: 0.75rem; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                color: white; padding: 40px; border-radius: 15px; margin-bottom: 30px; }
    </style>
</head>
<body>
<div class="container mt-4">

    <!-- NAVBAR avec gestion session -->
    <nav class="navbar navbar-expand-lg rounded mb-4 px-3">
        <a class="navbar-brand fw-bold" href="/">🛒 Mcommerce</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <!-- Si connecté → affiche username et logout -->
            <span th:if="${session.username != null}" class="text-white">
                👤 <strong th:text="${session.username}">User</strong>
                <span th:text="${session.role}" class="badge bg-warning text-dark ms-1 badge-role"></span>
            </span>
            <a th:if="${session.username != null}"
               href="/logout" class="btn btn-outline-light btn-sm">
                Déconnexion
            </a>
            <!-- Si non connecté → affiche login/register -->
            <a th:if="${session.username == null}"
               href="/login" class="btn btn-outline-light btn-sm">
                Connexion
            </a>
            <a th:if="${session.username == null}"
               href="/register" class="btn btn-light btn-sm text-primary">
                S'inscrire
            </a>
        </div>
    </nav>

    <!-- HERO SECTION -->
    <div class="hero text-center">
        <h1 class="fw-bold">🛍️ Nos Produits</h1>
        <p class="mb-0 opacity-75">
            Découvrez notre catalogue et commandez en quelques clics
        </p>
        <!-- Message si non connecté -->
        <div th:if="${session.username == null}" class="mt-3">
            <a href="/login" class="btn btn-warning fw-bold">
                Connectez-vous pour commander
            </a>
        </div>
    </div>

    <!-- LISTE DES PRODUITS -->
    <div class="row gy-4">
        <div th:each="produit : ${produits}" class="col-md-4">
            <div class="card h-100 shadow-sm">
                <img th:src="${produit.image}"
                     class="card-img-top"
                     alt="Produit"
                     style="height:220px; object-fit:cover; border-radius: 12px 12px 0 0;"
                     onerror="this.src='https://via.placeholder.com/400x220?text=Produit'" />
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold" th:text="${produit.titre}">Titre</h5>
                    <p class="card-text text-muted text-truncate"
                       th:text="${produit.description}">Description</p>
                    <p class="fw-bold text-primary fs-5">
                        <span th:text="${produit.prix}"></span> €
                    </p>
                    <div class="mt-auto">
                        <a th:href="@{|/details-produit/${produit.id}|}"
                           class="btn btn-primary w-100 rounded-pill">
                            Voir les détails →
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message si aucun produit -->
        <div th:if="${#lists.isEmpty(produits)}" class="col-12 text-center py-5">
            <p class="text-muted fs-5">Aucun produit disponible pour le moment.</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
